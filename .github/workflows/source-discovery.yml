name: Source Discovery & Score Recalculation

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  source-discovery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Checkout State Branch
        run: |
          git fetch origin state:state || git branch state
          git checkout state || git checkout -b state

      - name: Run Source Discovery & Re-Tiering
        run: |
          python -m collector.main --tier P3

      - name: Commit State Branch Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: state
          commit_message: "chore(state): re-tier sources and update registry [skip ci]"
          file_pattern: "state/*.json data/source_registry.json"
